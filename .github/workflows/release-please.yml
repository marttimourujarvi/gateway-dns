name: Release Please

on:
  # Manual trigger: run when you decide a batch of changes is ready to ship.
  workflow_dispatch:
  # Weekly cron: keeps the release PR up-to-date without daily noise.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
