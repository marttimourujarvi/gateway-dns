apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: httproute-dns
  name: httproute-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httproute-dns
  template:
    metadata:
      labels:
        app: httproute-dns
    spec:
      serviceAccount: httproute-dns
      containers:
      - image: gateway-dns:latest #mmouru/httproute-dns:0.1.0
        imagePullPolicy: Never
        name: dns-store
        ports:
        - containerPort: 53
          protocol: UDP

